<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>FolioEpub 阅读</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #f4f2ec;
    font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: pan-y;
  }
  #view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* 三区点击：左=上一页，右=下一页，中=切换工具栏 */
  .zone {
    position: absolute;
    top: 0; bottom: 0;
    width: 33.33%;
    z-index: 5;
  }
  #zone-l { left: 0; }
  #zone-m { left: 33.33%; }
  #zone-r { right: 0; }

  /* 顶/底部工具栏 */
  #bars {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #bars.hidden { opacity: 0; }
  #bars .bar {
    position: absolute;
    left: 0; right: 0;
    height: 56px;
    background: rgba(30, 30, 30, 0.92);
    color: #f5f5f5;
    display: flex;
    align-items: center;
    padding: 0 16px;
    box-sizing: border-box;
  }
  #bar-top { top: 0; }
  #bar-bottom { bottom: 0; justify-content: space-between; gap: 12px; }
  #btn-back {
    /* #bars 是 pointer-events:none（让点击穿透到翻页区），按钮需单独放行命中 */
    pointer-events: auto;
    background: transparent;
    color: inherit;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 6px;
    font-size: 14px;
    padding: 4px 10px;
    margin-right: 10px;
    cursor: pointer;
  }
  #title { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #progress { font-size: 13px; opacity: 0.85; white-space: nowrap; }
  #status {
    position: absolute;
    left: 0; right: 0;
    bottom: 64px;
    z-index: 11;
    text-align: center;
    pointer-events: none;
    color: #8a8a8a;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #status.show { opacity: 1; }
</style>
</head>
<body>
<foliate-view id="view"></foliate-view>

<div id="zone-l" class="zone"></div>
<div id="zone-m" class="zone"></div>
<div id="zone-r" class="zone"></div>

<div id="bars" class="hidden">
  <div id="bar-top" class="bar">
    <button id="btn-back" type="button">‹ 书架</button>
    <span id="title">—</span>
  </div>
  <div id="bar-bottom" class="bar">
    <span>第 <span id="chapter">0</span> 章</span>
    <span id="progress">0%</span>
  </div>
</div>
<div id="status"></div>

<script type="module">
import './foliate-js/view.js'

const $ = id => document.getElementById(id)
const toast = msg => {
  const el = $('status')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(toast._t)
  toast._t = setTimeout(() => el.classList.remove('show'), 1200)
}

/** Android -> JS：由 Kotlin 通过 evaluateJavascript 调用。 */
window.folioWebView = {
  next: () => view.goRight().then(() => log('next')),
  prev: () => view.goLeft().then(() => log('prev')),
  getLocation: () => JSON.stringify(view.lastLocation ?? {}),
}

const log = msg => {
  console.log('[folio]', msg)
  // JSBridge 上报日志（Kotlin 注入 EPUBBridge 时可看到）
  if (typeof EPUBBridge !== 'undefined' && EPUBBridge.log) EPUBBridge.log(msg)
}

const view = $('view')
view.setAttribute('flow', 'paginated')

view.addEventListener('relocate', e => {
  const loc = view.lastLocation ?? e.detail ?? {}
  // lastLocation.section.current = 章节索引；fraction = 全书进度(0..1)
  const chapter = (loc.section?.current ?? 0) + 1
  $('chapter').textContent = String(chapter)
  const pct = Math.round((loc.fraction ?? 0) * 100)
  $('progress').textContent = `${pct}%`
  log(`relocate chapter=${chapter} fraction=${(loc.fraction ?? 0).toFixed(4)}`)
  // 上报完整定位（含 cfi）给 Kotlin 落库，用于重开恢复
  if (typeof EPUBBridge !== 'undefined' && EPUBBridge.onLocation) {
    EPUBBridge.onLocation(JSON.stringify(loc))
  }
})

view.addEventListener('load', e => {
  $('title').textContent = view.book?.metadata?.title || '未知书名'
  log(`onLoad index=${e.detail.index}`)
})

view.addEventListener('error', e => {
  log('view error: ' + (e.detail ?? e.message ?? e))
  toast('渲染出错')
})

// 三区点击
$('zone-l').addEventListener('click', () => view.goLeft().then(() => {}))
$('zone-r').addEventListener('click', () => view.goRight().then(() => {}))
$('zone-m').addEventListener('click', () => $('bars').classList.toggle('hidden'))

// 返回书架
$('btn-back').addEventListener('click', e => {
  e.stopPropagation()
  if (typeof EPUBBridge !== 'undefined' && EPUBBridge.back) EPUBBridge.back()
  else history.back()
})

// ── 滑动翻页（默认动画）───────────────────────────
// 走 foliate 原生分栏滚动：拖动时 renderer.scrollBy(dx,0) 会真切露出相邻列，
// 实现"滑动过程中两页同屏"；松手用 next/prev 提交翻页（animated 平滑滑动），
// 位移过小则 snap() 吸附回当前页。
// TODO(settings): 翻页动画（滑动/无）需要一个后台开关，暂未实现，先默认滑动。
const SWIPE_LIMIT = 48 // 触发翻页的最小水平位移(px)
let touch = { startX: 0, startY: 0, time: 0, dx: 0, lastX: 0, lastY: 0, vx: 0, vy: 0, active: false }

addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return
  const t = e.touches[0]
  touch = {
    startX: t.clientX, startY: t.clientY,
    time: e.timeStamp, dx: 0, lastX: t.clientX, lastY: t.clientY, vx: 0, vy: 0, active: true,
  }
}, { passive: true })

addEventListener('touchmove', e => {
  if (!touch.active) return
  const t = e.touches[0]
  const x = t.clientX - touch.startX
  const y = t.clientY - touch.startY
  const dt = Math.max(1, e.timeStamp - touch.time)
  touch.vx = (t.clientX - touch.lastX) / dt
  touch.vy = (t.clientY - touch.lastY) / dt
  touch.lastX = t.clientX
  touch.lastY = t.clientY
  touch.time = e.timeStamp
  // 判定为横向滑动：锁死方向、阻止默认滚动与点击穿透
  if (Math.abs(x) > Math.abs(y) && Math.abs(x) > 2) {
    e.preventDefault()
    const r = view.renderer
    if (r) r.scrollBy(-(x - touch.dx), 0) // 负增量取反：左滑→scrollLeft 增大→露出下一页
    touch.dx = x
  }
}, { passive: false })

addEventListener('touchend', e => {
  if (!touch.active) return
  touch.active = false
  const r = view.renderer
  if (!r) return
  if (touch.dx <= -SWIPE_LIMIT) r.next()          // 左滑 → 下一页
  else if (touch.dx >= SWIPE_LIMIT) r.prev()      // 右滑 → 上一页
  else r.snap(touch.vx, touch.vy)                 // 位移不足 → 吸附回当前页
}, { passive: true })

addEventListener('touchcancel', () => {
  touch.active = false
}, { passive: true })

// 读取当前打开的书（由 Kotlin 经虚拟路径 /book/current.epub 提供字节）
async function loadBook(path) {
  const res = await fetch(path)
  if (!res.ok) throw new Error(`fetch ${path} -> ${res.status}`)
  const blob = await res.blob()
  const file = new File([blob], path.split('/').pop(), { type: 'application/epub+zip' })
  // 若 Kotlin 记录了上次定位，回传给 init 恢复到对应章节/页；否则从正文首章开始
  const saved = typeof EPUBBridge !== 'undefined' && EPUBBridge.getSavedLocator
    ? EPUBBridge.getSavedLocator()
    : null
  await view.open(file)
  if (saved) {
    log('restoring locator')
    await view.init({ lastLocation: JSON.parse(saved), showTextStart: false })
    // 诊断：等分页 reflow 落定后，对比恢复到的实际位置与保存值
    setTimeout(() => {
      const loc = view.lastLocation
      log('settled fraction=' + (loc?.fraction ?? 'none').toFixed(4) + ' saved=' + (JSON.parse(saved).fraction ?? 0).toFixed(4))
    }, 1200)
  } else {
    log('no saved locator, opening from start')
    await view.init({ showTextStart: true })
  }
}

loadBook('/book/current.epub')
  .then(() => {
    log('book opened')
    // 启用 foliate 翻页动画（平滑滑动 300ms）
    view.renderer?.setAttribute?.('animated', '')
  })
  .catch(err => {
    console.error(err)
    // 主动上报给 Kotlin（此设备 WebView 不回调 onConsoleMessage）
    if (typeof EPUBBridge !== 'undefined' && EPUBBridge.log) {
      EPUBBridge.log('open failed: ' + (err && (err.message || err.stack) || err))
    }
    toast('打开失败: ' + (err && err.message || err))
  })
</script>
</body>
</html>
